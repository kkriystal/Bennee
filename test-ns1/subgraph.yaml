specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: A
    network: holesky
    source:
      address: "0xF2414E7506AEf59C3b0b3A9Fc2B0537a9521f8E0"
      abi: A
      startBlock: 3482450
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Borrowed
        - CancelledRequest
        - CancelledSupply
        - ConvertedToToken
        - DefaultWithdraw
        - FxRateUpdated
        - FxSchedulerUpdated
        - OwnershipTransferStarted
        - OwnershipTransferred
        - Repaid
        - Requested
        - SignerUpdated
        - Supplied
        - Withdraw
      abis:
        - name: A
          file: ./abis/A.json
      eventHandlers:
        - event: Borrowed(address,uint256,uint256,uint256)
          handler: handleBorrowed
        - event: CancelledRequest(address,uint256)
          handler: handleCancelledRequest
        - event: CancelledSupply(address,uint256,uint256)
          handler: handleCancelledSupply
        - event: ConvertedToToken(address,uint256,uint256)
          handler: handleConvertedToToken
        - event: DefaultWithdraw(address,uint256,uint256)
          handler: handleDefaultWithdraw
        - event: FxRateUpdated(address,uint256)
          handler: handleFxRateUpdated
        - event: FxSchedulerUpdated(address,address)
          handler: handleFxSchedulerUpdated
        - event: OwnershipTransferStarted(indexed address,indexed address)
          handler: handleOwnershipTransferStarted
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Repaid(address,uint256,uint256,uint256,uint256)
          handler: handleRepaid
        - event: Requested(address,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleRequested
        - event: SignerUpdated(address,address)
          handler: handleSignerUpdated
        - event: Supplied(address,uint256,uint256)
          handler: handleSupplied
        - event: Withdraw(address,uint256,uint256)
          handler: handleWithdraw
      file: ./src/a.ts
